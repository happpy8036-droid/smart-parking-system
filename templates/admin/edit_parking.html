{% extends 'layouts/base.html' %}

{% block title %}Edit — {{ area.name }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 0 auto; padding: 2rem 1rem;">
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 2rem;">EDIT LOCATION</h1>

    <form method="POST" action="/admin/edit-parking/{{ area.id }}">
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Name</label>
            <input type="text" name="name" value="{{ area.name }}" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Address</label>
            <input type="text" name="address" value="{{ area.address }}" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">City</label>
            <input type="text" name="city" value="{{ area.city }}" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Area</label>
            <input type="text" name="area" value="{{ area.area }}" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Price Per Hour (₹)</label>
            <input type="number" name="price_per_hour" value="{{ area.price_per_hour }}" required step="0.01" min="0" style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="brutalist-btn" style="flex: 1;">UPDATE LOCATION</button>
            <a href="/admin/parking-locations" class="brutalist-btn btn-secondary">CANCEL</a>
        </div>
    </form>
</div>
{% endblock %}
