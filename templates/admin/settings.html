{% extends 'layouts/base.html' %}

{% block title %}Settings — Admin{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 0 auto; padding: 2rem 1rem;">
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 2rem;">SETTINGS</h1>

    <form method="POST" action="/admin/settings">
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Admin Name</label>
            <input type="text" name="name" value="{{ current_user.name }}" style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Email</label>
            <input type="email" name="email" value="{{ current_user.email }}" style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
        </div>
        <button type="submit" class="brutalist-btn">SAVE SETTINGS</button>
    </form>
</div>
{% endblock %}
