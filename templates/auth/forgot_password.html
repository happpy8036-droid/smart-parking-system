{% extends 'layouts/base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 0 auto; padding: 2rem 1rem;">
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 1rem;">FORGOT PASSWORD</h1>
    <p style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 2rem;">Enter your email address and we'll send you a link to reset your password.</p>

    <form method="POST" action="/forgot-password">
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Email Address</label>
            <input type="email" name="email" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
        </div>
        <button type="submit" class="brutalist-btn" style="width: 100%;">SEND RESET LINK</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; opacity: 0.7;">
        Remember your password? <a href="/login" style="color: #10B981;">Login here</a>
    </p>
</div>
{% endblock %}
