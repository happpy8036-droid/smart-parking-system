<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ parking_name }} - Map</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .map-header {
            padding: 20px;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .map-header h2 {
            margin: 0 0 8px;
        }

        .map-container {
            width: 100%;
            height: 70vh;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-actions {
            padding: 15px;
            text-align: center;
            background: white;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 8px;
            text-decoration: none;
            background: #10b981;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #059669;
        }
    </style>
</head>

<body>

<div class="map-header">
    <h2>📍 {{ parking_name }}</h2>
    <p>Smart Parking Location</p>
</div>

<div class="map-container">
    <div id="map"></div>
</div>

<div class="map-actions">

    <button class="btn" onclick="getDirections()">
        🧭 Get Directions
    </button>

    <a href="javascript:history.back()" class="btn">
        ← Back
    </a>

</div>


<script>
    const parkingLat = {{ latitude }};
    const parkingLng = {{ longitude }};

    function initMap() {

        const parkingLocation = {
            lat: Number(parkingLat),
            lng: Number(parkingLng)
        };

        const map = new google.maps.Map(
            document.getElementById("map"),
            {
                zoom: 15,
                center: parkingLocation,
                mapTypeControl: true,
                streetViewControl: true,
                fullscreenControl: true
            }
        );

        const marker = new google.maps.Marker({
            position: parkingLocation,
            map: map,
            title: "{{ parking_name }}"
        });

        const infoWindow = new google.maps.InfoWindow({
            content: `
                <div>
                    <h3>🅿️ {{ parking_name }}</h3>
                    <p>Smart Parking Area</p>
                </div>
            `
        });

        marker.addListener("click", () => {
            infoWindow.open(map, marker);
        });
    }


    function getDirections() {

        if (!navigator.geolocation) {
            alert("Location is not supported by your browser.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {

                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                const destination =
                    parkingLat + "," + parkingLng;

                const url =
                    "https://www.google.com/maps/dir/?api=1" +
                    "&origin=" + userLat + "," + userLng +
                    "&destination=" + destination;

                window.open(url, "_blank");
            },

            function() {
                alert("Please allow location permission to get directions.");
            }
        );
    }
</script>


<!-- Replace YOUR_GOOGLE_MAPS_API_KEY with your actual API key -->
<script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
</script>

</body>
</html>
