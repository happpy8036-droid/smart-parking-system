{% extends 'layouts/base.html' %}

{% block title %}Feedback{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 0 auto; padding: 2rem 1rem;">
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 2rem;">FEEDBACK</h1>

    <form method="POST" action="/user/feedback">
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Rating (1-5)</label>
            <input type="number" name="rating" min="1" max="5" value="5" style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Message</label>
            <textarea name="message" rows="4" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 1rem; resize: vertical;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'"></textarea>
        </div>
        <button type="submit" class="brutalist-btn" style="width: 100%;">SUBMIT FEEDBACK</button>
    </form>
</div>
{% endblock %}
